# Continuous integration: runs your automated tests on every push and pull
# request. A green check here is evidence for the "automated tests" and
# "reproducible setup" eligibility gates.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions: 
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test